# Deploy bot/ to the VPS. Public-repo rules (live-bot-architecture-plan.md):
# - exactly two secrets (VPS_SSH_KEY, VPS_HOST) in the 'vps' environment
# - CI never sees trading secrets; it ships code and restarts the service
# - no pull_request_target, no self-hosted runner, actions pinned by SHA
name: deploy
on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: git ref to deploy (rollback tool)
        default: main

concurrency: deploy-vps
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -r bot/requirements.txt
      - run: python -m pytest bot/tests -q

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: vps
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: deploy over SSH
        run: >
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_HOST }}"
          'bash /opt/traderbot/bot/deploy/update.sh "${{ inputs.ref || 'main' }}"'
